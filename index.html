<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Cuantitativas — Mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #fafaf8;
    --bg-sidebar: #f0efeb;
    --text: #1a1a1a;
    --text-muted: #5c5c5c;
    --accent: #3d5a99;
    --accent-light: #e8edf5;
    --bolt: #c4710a;
    --bolt-bg: #fef6e8;
    --question: #8b3a62;
    --question-bg: #f8edf3;
    --arrow: #3d7a5a;
    --border: #d8d6d0;
    --code-bg: #eeeee8;
    --shadow: rgba(0,0,0,.06);
    --hl: #fde68a;
    --radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618;
      --bg-sidebar: #1c1c1f;
      --text: #d8d8d4;
      --text-muted: #8a8a86;
      --accent: #7ea4db;
      --accent-light: #1e2a3d;
      --bolt: #e0a840;
      --bolt-bg: #2a2418;
      --question: #c87aa6;
      --question-bg: #2a1c24;
      --arrow: #6ab88a;
      --border: #2e2e30;
      --code-bg: #222224;
      --shadow: rgba(0,0,0,.25);
      --hl: #6b5514;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
  }

  /* ── Layout ── */
  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }

  @media (max-width: 800px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .sidebar.open { display: block; position: fixed; inset: 0; z-index: 90; overflow-y: auto; }
    .mobile-bar { display: flex !important; }
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    font-size: 13px;
  }

  .sidebar-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    padding: 0 1.25rem 1rem;
    color: var(--text-muted);
  }

  .filter-bar {
    padding: 0 1rem .75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .toc-list { list-style: none; }

  .toc-group { border-bottom: 1px solid transparent; }

  .toc-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: none;
    border: none;
    padding: 6px 1.25rem;
    cursor: pointer;
    text-align: left;
  }
  .toc-group-header:hover { background: var(--shadow); }
  .toc-group-header .chevron {
    display: inline-block;
    font-size: 10px;
    color: var(--text-muted);
    transition: transform .15s;
    flex: none;
  }
  .toc-group.open .toc-group-header .chevron { transform: rotate(90deg); }
  .toc-group-header .count {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
  }
  .toc-group-header.active-group { color: var(--accent); }

  .toc-sublist {
    list-style: none;
    overflow: hidden;
    max-height: 0;
    transition: max-height .2s ease;
  }
  .toc-group.open .toc-sublist { max-height: 2000px; }

  .toc-item {
    display: block;
    padding: 4px 1.25rem;
    color: var(--text-muted);
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: all .12s;
    line-height: 1.4;
  }
  .toc-item:hover { color: var(--text); background: var(--shadow); }
  .toc-item.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }

  .toc-item[data-depth="2"] { padding-left: 1.75rem; font-weight: 500; margin-top: .35rem; }
  .toc-item[data-depth="3"] { padding-left: 2.5rem; font-size: 12.5px; }

  /* ── Main content ── */
  .main {
    max-width: 740px;
    padding: 2.5rem 3rem 6rem;
  }
  @media (max-width: 800px) { .main { padding: 1.5rem 1.25rem 4rem; } }

  .mobile-bar {
    display: none;
    position: sticky;
    top: 0;
    z-index: 80;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    align-items: center;
    gap: 12px;
  }
  .mobile-bar button {
    font-family: inherit;
    font-size: 14px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 10px;
    color: var(--text);
    cursor: pointer;
  }

  /* ── Typography ── */
  .content h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 3rem 0 .5rem;
    padding-bottom: .35rem;
    border-bottom: 2px solid var(--accent);
    color: var(--accent);
  }
  .content h1:first-child { margin-top: 0; }

  .content h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 2rem 0 .4rem;
    color: var(--text);
  }

  .content h3 {
    font-size: 1rem;
    font-weight: 600;
    margin: 1.5rem 0 .25rem;
    color: var(--text);
    padding: 6px 10px;
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
  }

  .content p { margin: .45rem 0; max-width: 65ch; }
  .content ul, .content ol { margin: .4rem 0 .4rem 1.5rem; }
  .content li { margin: .2rem 0; }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

  .content blockquote {
    border-left: 3px solid var(--border);
    padding: .5rem 1rem;
    color: var(--text-muted);
    font-size: 14px;
    margin: .75rem 0;
    background: var(--code-bg);
    border-radius: var(--radius);
  }

  .content table {
    border-collapse: collapse;
    font-size: 14px;
    margin: .75rem 0;
    width: 100%;
  }
  .content th, .content td {
    padding: 6px 12px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .content th { background: var(--bg-sidebar); font-weight: 600; }

  .content code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: var(--radius);
  }
  .content pre {
    background: var(--code-bg);
    padding: .75rem 1rem;
    border-radius: var(--radius);
    overflow-x: auto;
    font-size: 13px;
    margin: .75rem 0;
  }
  .content pre code { background: none; padding: 0; }

  .content a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .content a:hover { border-bottom-color: var(--accent); }

  /* ── Special markers ── */
  .content .katex { font-size: 1.02em; }
  .content h3 .katex { font-size: .95em; }

  /* Style the → connection lines */
  .content p { word-wrap: break-word; }

  .arrow-line {
    display: block;
    margin-top: 4px;
    padding: 3px 8px;
    font-size: 13px;
    color: var(--arrow);
    background: transparent;
    border-radius: var(--radius);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.5;
  }

  .arrow-line a.concept-link {
    color: var(--arrow);
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
    cursor: pointer;
  }
  .arrow-line a.concept-link:hover { border-bottom-style: solid; }

  .bolt-mark {
    color: var(--bolt);
    font-weight: 600;
    background: var(--bolt-bg);
    padding: 0 3px;
    border-radius: 2px;
  }

  /* ── Bloque plegable "más" ── */
  .content details {
    margin: .35rem 0 .9rem;
  }
  .content details > summary {
    cursor: pointer;
    display: inline-block;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-muted);
    padding: 1px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    list-style: none;
    user-select: none;
  }
  .content details > summary::-webkit-details-marker { display: none; }
  .content details > summary::before { content: '+ '; }
  .content details[open] > summary::before { content: '– '; }
  .content details > summary:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .content details[open] > summary {
    margin-bottom: .35rem;
  }
  .content details[open] {
    border-left: 2px solid var(--border);
    padding: 0 0 .2rem .9rem;
  }
  .content details p { margin: .35rem 0; font-size: 14px; }

  /* ── "Idea general": la tapa de cada clase ── */
  .content .overview {
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: .9rem 1.1rem 1rem;
    margin: 1rem 0 1.75rem;
  }
  .content .overview h2 {
    margin: 0 0 .5rem;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .content .overview p { max-width: none; }
  .content .overview strong { color: var(--accent); }
  .content .overview blockquote {
    margin: .75rem 0 0;
    background: var(--bg);
    border-left-color: var(--accent);
  }
  /* la búsqueda oculta el h2 + su cuerpo; la card no debe quedar vacía */
  .content .overview:has(> h2.hidden) { display: none; }

  .question-block {
    border-left: 3px solid var(--question);
    background: var(--question-bg);
    padding: .5rem 1rem;
    border-radius: var(--radius);
    margin: .5rem 0;
  }

  /* ── Search ── */
  .search-box {
    margin: 0 1rem .75rem;
  }
  .search-box input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-muted); }

  /* ── Scroll highlighting ── */
  .highlight-flash {
    animation: flash .8s ease-out;
  }
  @keyframes flash {
    0% { background: var(--accent-light); }
    100% { background: transparent; }
  }

  /* ── Botón volver (historial de saltos por links de concepto) ── */
  .back-btn {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 70;
    max-width: calc(100vw - 2.5rem);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-sidebar);
    color: var(--arrow);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .back-btn:hover { border-color: var(--arrow); }

  /* hidden by filter / search */
  .content .hidden { display: none; }

  .content mark.hl {
    background: var(--hl);
    color: inherit;
    padding: 0 1px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="mobile-bar">
  <button onclick="document.querySelector('.sidebar').classList.toggle('open')">☰ Índice</button>
  <span style="font-size:13px;color:var(--text-muted)">Finanzas Cuantitativas</span>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">Finanzas Cuanti</div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Buscar concepto…" autocomplete="off">
    </div>
    <div class="filter-bar" id="filters"></div>
    <ul class="toc-list" id="toc"></ul>
  </nav>

  <main class="main">
    <div class="content" id="content">
      <p style="color:var(--text-muted)">Cargando…</p>
    </div>
  </main>
</div>

<button id="back-btn" class="back-btn" type="button" hidden></button>

<script>
(async () => {
  // ── Fetch and render markdown ──
  const mdFile = 'finanzas_cuanti.md';
  let md;
  try {
    const res = await fetch(mdFile + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch {
    document.getElementById('content').innerHTML =
      `<p>No se encontró <code>${mdFile}</code> en el mismo directorio.<br>
       Asegurate de que el archivo esté al lado de este <code>index.html</code>.</p>`;
    return;
  }

  // Configure marked
  marked.setOptions({ gfm: true, breaks: false });

  // Proteger las fórmulas \( \) y \[ \] de marked (trataría \( como escape, y _ * <
  // como énfasis/HTML). Se reemplazan por placeholders y se restauran escapadas.
  const mathStore = [];
  const protectedMd = md.replace(/\\\((.+?)\\\)|\\\[([\s\S]+?)\\\]/g, m => {
    mathStore.push(m);
    return `@@MATH${mathStore.length - 1}@@`;
  });
  const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const raw = marked.parse(protectedMd).replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(mathStore[+i]));
  const content = document.getElementById('content');
  content.innerHTML = raw;

  // ── Render fórmulas LaTeX con KaTeX ──
  // Usa \( \) y \[ \] como delimitadores (no $ $) porque el markdown
  // usa $ para montos de dinero (ej. "$100"), que no son matemática.
  if (window.renderMathInElement) {
    renderMathInElement(content, {
      delimiters: [
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$$', right: '$$', display: true }
      ],
      throwOnError: false
    });
  }

  // ── Post-process: style arrows, bolts, questions ──
  content.querySelectorAll('p').forEach(p => {
    const text = p.textContent;
    // Arrow lines (→ connections)
    if (text.startsWith('→')) {
      p.classList.add('arrow-line');
    }
    // Question blocks
    if (text.includes('❓')) {
      p.classList.add('question-block');
    }
  });

  // Style ⚡ marks
  content.innerHTML = content.innerHTML.replace(/⚡/g, '<span class="bolt-mark">⚡</span>');

  // ── "Idea general": la tapa de cada clase se envuelve en una card ──
  content.querySelectorAll('h2').forEach(h2 => {
    if (!/^idea general/i.test(h2.textContent.trim())) return;
    const card = document.createElement('div');
    card.className = 'overview';
    h2.parentNode.insertBefore(card, h2);
    card.appendChild(h2);
    let sib = card.nextSibling;
    while (sib && !(sib.nodeType === 1 && ['H1', 'H2', 'H3'].includes(sib.tagName))) {
      const move = sib;
      sib = sib.nextSibling;
      card.appendChild(move);
    }
  });

  // ── Wrap sections by h1 for filtering ──
  const h1s = content.querySelectorAll('h1');
  h1s.forEach(h1 => {
    const section = document.createElement('section');
    // detect class tag from h1 text
    const match = h1.textContent.match(/C(\d+)/);
    if (match) section.dataset.clase = 'C' + match[1];
    // also handle C7-C8
    const matchRange = h1.textContent.match(/C(\d+)[–-]C?(\d+)/);
    if (matchRange) {
      section.dataset.clase = 'C' + matchRange[1];
      section.dataset.clase2 = 'C' + matchRange[2];
    }

    h1.parentNode.insertBefore(section, h1);
    section.appendChild(h1);
    let next = section.nextSibling;
    while (next && !(next.nodeType === 1 && next.tagName === 'H1')) {
      const move = next;
      next = next.nextSibling;
      section.appendChild(move);
    }
  });

  // ── Search helpers ──
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  // KaTeX duplica cada fórmula en MathML + HTML; nos quedamos con una sola copia.
  const searchText = el => {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('.katex-mathml').forEach(n => n.remove());
    return clone.textContent;
  };

  const clearHighlights = root => {
    root.querySelectorAll('mark.hl').forEach(m => {
      const parent = m.parentNode;
      m.replaceWith(document.createTextNode(m.textContent));
      parent.normalize();
    });
  };

  // Resalta q (ya normalizado) en los nodos de texto de root. Como norm() puede
  // cambiar la longitud, se mapea cada índice normalizado a su índice original.
  const highlight = (root, q) => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => n.parentNode.closest('.katex, mark.hl') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node => {
      const orig = node.textContent;
      let normed = '';
      const map = [];
      for (let i = 0; i < orig.length; i++) {
        const n = norm(orig[i]);
        for (let k = 0; k < n.length; k++) map.push(i);
        normed += n;
      }
      const ranges = [];
      let pos = normed.indexOf(q);
      while (pos !== -1) {
        ranges.push([map[pos], map[pos + q.length - 1] + 1]);
        pos = normed.indexOf(q, pos + q.length);
      }
      if (!ranges.length) return;

      const frag = document.createDocumentFragment();
      let last = 0;
      ranges.forEach(([s, e]) => {
        if (s > last) frag.appendChild(document.createTextNode(orig.slice(last, s)));
        const mark = document.createElement('mark');
        mark.className = 'hl';
        mark.textContent = orig.slice(s, e);
        frag.appendChild(mark);
        last = e;
      });
      if (last < orig.length) frag.appendChild(document.createTextNode(orig.slice(last)));
      node.replaceWith(frag);
    });
  };

  // Si el destino está oculto por filtro/búsqueda, volver a "Todas" primero.
  const revealIfHidden = el => {
    if (el.closest('.hidden')) document.querySelector('.filter-btn').click();
  };
  const flash = el => {
    el.classList.add('highlight-flash');
    setTimeout(() => el.classList.remove('highlight-flash'), 900);
  };
  const goTo = h => {
    revealIfHidden(h);
    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    flash(h);
    document.querySelector('.sidebar').classList.remove('open');
  };
  const ownerHeading = node => {
    let h = node.previousElementSibling;
    while (h && !['H2', 'H3'].includes(h.tagName)) h = h.previousElementSibling;
    return h;
  };

  // ── Historial de saltos por links de concepto ──
  const jumpStack = [];
  const backBtn = document.getElementById('back-btn');
  const renderBackBtn = () => {
    const top = jumpStack[jumpStack.length - 1];
    backBtn.hidden = !top;
    if (top) backBtn.textContent = `← Volver a «${top.label}»`;
  };
  backBtn.addEventListener('click', () => {
    const { from } = jumpStack.pop();
    revealIfHidden(from);
    from.scrollIntoView({ behavior: 'smooth', block: 'center' });
    flash(from);
    renderBackBtn();
  });

  // ── Build TOC: one collapsible group per clase (h1), concepts nested inside ──
  const toc = document.getElementById('toc');
  const headings = content.querySelectorAll('h1, h2, h3');
  headings.forEach((h, i) => { h.id = 'h-' + i; });

  const tocItems = [];
  const tocGroups = [];

  content.querySelectorAll('section').forEach(section => {
    const h1 = section.querySelector('h1');
    if (!h1) return;

    const group = document.createElement('li');
    group.className = 'toc-group';

    const header = document.createElement('button');
    header.type = 'button';
    header.className = 'toc-group-header';

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '▸';
    header.appendChild(chevron);

    const label = document.createElement('span');
    label.textContent = searchText(h1).replace(/\[C\d.*?\]/g, '').trim();
    header.appendChild(label);

    const subHeadings = section.querySelectorAll('h2, h3');
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = subHeadings.length;
    header.appendChild(count);

    header.addEventListener('click', () => {
      if (group.classList.contains('open')) group.classList.remove('open');
      else openOnly(group);
    });
    group.appendChild(header);

    const sublist = document.createElement('ul');
    sublist.className = 'toc-sublist';

    subHeadings.forEach(h => {
      const text = searchText(h).replace(/\[C\d.*?\]/g, '').trim();
      if (!text) return;

      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.className = 'toc-item';
      a.dataset.depth = parseInt(h.tagName[1]);
      a.textContent = text.length > 42 ? text.slice(0, 40) + '…' : text;
      a.addEventListener('click', e => { e.preventDefault(); goTo(h); });
      sublist.appendChild(a);

      const bodyNodes = [];
      let sib = h.nextElementSibling;
      while (sib && !['H1', 'H2', 'H3'].includes(sib.tagName)) {
        bodyNodes.push(sib);
        sib = sib.nextElementSibling;
      }
      const searchable = norm(searchText(h) + ' ' + bodyNodes.map(searchText).join(' '));

      tocItems.push({ el: a, heading: h, depth: parseInt(h.tagName[1]), group, section, bodyNodes, text: searchable });
    });

    group.appendChild(sublist);
    toc.appendChild(group);
    tocGroups.push({ el: group, header, section });
  });

  // Acordeón: en todo momento hay un solo grupo abierto (el de la clase que se lee).
  const openOnly = groupEl => tocGroups.forEach(g => g.el.classList.toggle('open', g.el === groupEl));
  const activeGroup = () => tocGroups.find(g => g.header.classList.contains('active-group')) || tocGroups[0];
  if (tocGroups.length) openOnly(tocGroups[0].el);

  // ── Links en las líneas → : cada token se resuelve al heading que lo explica ──
  const words = s => norm(s.replace(/[₀-₉]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x2080 + 48)))
    .split(/[^a-z0-9]+/).filter(Boolean);
  const stem = w => w.replace(/s$/, '');
  const eqExact = (a, b) => a === b;
  const eqStem = (a, b) => stem(a) === stem(b);
  // (a = palabra del título, b = palabra del token) — permite abreviaturas tipo vol → volatilidad
  const eqPrefix = (a, b) => eqStem(a, b) || (b.length >= 3 && a.startsWith(b));
  const containsSeq = (hay, needle, eq) => {
    if (!needle.length || needle.length > hay.length) return false;
    for (let i = 0; i + needle.length <= hay.length; i++) {
      if (needle.every((w, k) => eq(hay[i + k], w))) return true;
    }
    return false;
  };
  const containsAll = (hay, needle, eq) => needle.every(w => hay.some(h => eq(h, w)));

  const headingIndex = tocItems
    .filter(t => t.section.dataset.clase)
    .map(t => ({ t, words: words(searchText(t.heading).replace(/\[C\d.*?\]/g, '')) }));

  const resolveToken = (token, fromSection, selfHeading) => {
    const hint = (token.match(/\(C(\d)\)/) || [])[1];
    const tw = words(token.replace(/⚡/g, '').replace(/\([^)]*\)/g, '').replace(/_/g, ' '));
    if (!tw.length) return null;

    const pick = (matcher, eq) => {
      const cands = headingIndex.filter(h => h.t.heading !== selfHeading && matcher(h.words, tw, eq));
      if (!cands.length) return null;
      const score = h => {
        let s = 0;
        if (h.words.length === tw.length) s += 1000;
        s -= h.words.length * 10;
        if (hint && h.t.section.dataset.clase === 'C' + hint) s += 100;
        else if (!hint && h.t.section === fromSection) s += 5;
        return s;
      };
      return cands.sort((a, b) => score(b) - score(a))[0].t.heading;
    };
    return pick(containsSeq, eqExact) || pick(containsSeq, eqStem) || pick(containsAll, eqPrefix);
  };

  const withBolt = s => escapeHtml(s).replace(/⚡/g, '<span class="bolt-mark">⚡</span>');

  content.querySelectorAll('p.arrow-line').forEach(p => {
    const fromSection = p.closest('section');
    const selfHeading = ownerHeading(p);

    const tokens = p.textContent.replace(/^→\s*/, '').split('·').map(s => s.trim()).filter(Boolean);
    p.innerHTML = '→ ' + tokens.map(tok => {
      const target = resolveToken(tok, fromSection, selfHeading);
      return target
        ? `<a class="concept-link" href="#${target.id}">${withBolt(tok)}</a>`
        : withBolt(tok);
    }).join(' · ');
  });

  content.querySelectorAll('a.concept-link').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const from = a.closest('p.arrow-line');
      const owner = ownerHeading(from);
      const label = owner ? searchText(owner).replace(/\[C\d.*?\]/g, '').trim() : 'lectura';
      jumpStack.push({ from, label: label.length > 30 ? label.slice(0, 28) + '…' : label });
      renderBackBtn();
      goTo(document.getElementById(a.getAttribute('href').slice(1)));
    });
  });

  // ── Scroll spy ── (highlights active item + expands its group)
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        const activeSection = e.target.closest('section');
        tocItems.forEach(t => {
          t.el.classList.toggle('active', t.heading.id === id);
        });
        tocGroups.forEach(g => {
          const isActive = g.section === activeSection;
          g.header.classList.toggle('active-group', isActive);
          g.el.classList.toggle('open', isActive);
        });
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });

  headings.forEach(h => observer.observe(h));

  // ── Class filters ──
  const searchInput = document.getElementById('search');
  const showAllBlocks = () => {
    clearHighlights(content);
    tocItems.forEach(t => {
      t.heading.classList.remove('hidden');
      t.bodyNodes.forEach(n => n.classList.remove('hidden'));
      t.el.style.display = '';
    });
  };

  const filters = document.getElementById('filters');
  const clases = ['Todas', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8', 'C9'];
  clases.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (c === 'Todas' ? ' active' : '');
    btn.textContent = c;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      searchInput.value = '';
      showAllBlocks();

      content.querySelectorAll('section').forEach(s => {
        if (c === 'Todas') {
          s.classList.remove('hidden');
        } else {
          const match = s.dataset.clase === c || s.dataset.clase2 === c;
          s.classList.toggle('hidden', !match);
        }
      });

      // update TOC groups: show/hide + expand only the matching one (or the active one for "Todas")
      if (c === 'Todas') {
        tocGroups.forEach(g => { g.el.style.display = ''; });
        openOnly(activeGroup().el);
      } else {
        tocGroups.forEach(g => {
          const match = g.section.dataset.clase === c || g.section.dataset.clase2 === c;
          g.el.style.display = match ? '' : 'none';
          g.el.classList.toggle('open', match);
        });
      }
    });
    filters.appendChild(btn);
  });

  // ── Search ──
  searchInput.addEventListener('input', () => {
    const q = norm(searchInput.value.trim());
    // Reset class filter
    document.querySelectorAll('.filter-btn').forEach(b =>
      b.classList.toggle('active', b.textContent === 'Todas'));
    content.querySelectorAll('section').forEach(s => s.classList.remove('hidden'));

    if (!q) {
      showAllBlocks();
      tocGroups.forEach(g => { g.el.style.display = ''; });
      openOnly(activeGroup().el);
      return;
    }

    // Un h2 (§) se muestra si matchea él mismo o alguno de sus h3 hasta el próximo h2.
    const visible = tocItems.map(t => t.text.includes(q));
    tocItems.forEach((t, i) => {
      if (t.depth !== 2 || visible[i]) return;
      for (let j = i + 1; j < tocItems.length && tocItems[j].depth === 3 && tocItems[j].section === t.section; j++) {
        if (visible[j]) { visible[i] = true; break; }
      }
    });

    clearHighlights(content);
    tocItems.forEach((t, i) => {
      t.heading.classList.toggle('hidden', !visible[i]);
      t.bodyNodes.forEach(n => n.classList.toggle('hidden', !visible[i]));
      t.el.style.display = visible[i] ? '' : 'none';
      if (visible[i]) {
        highlight(t.heading, q);
        t.bodyNodes.forEach(n => highlight(n, q));
      }
    });

    tocGroups.forEach(g => {
      const anyMatch = tocItems.some((t, i) => t.group === g.el && visible[i]);
      g.el.style.display = anyMatch ? '' : 'none';
      g.el.classList.toggle('open', anyMatch);
      g.section.classList.toggle('hidden', !anyMatch);
    });
  });
})();
</script>
</body>
</html>
